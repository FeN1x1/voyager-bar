name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version

      - name: Build universal app, DMG and ZIP
        run: ./build.sh --dmg

      - name: Checksums
        run: |
          cd build
          shasum -a 256 VoyagerBar-*.dmg VoyagerBar-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VoyagerBar
          path: |
            build/VoyagerBar-*.dmg
            build/VoyagerBar-*.zip
            build/SHA256SUMS.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(build/VoyagerBar-*.dmg build/VoyagerBar-*.zip build/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Voyager Bar ${GITHUB_REF_NAME#v}" --generate-notes
          fi
